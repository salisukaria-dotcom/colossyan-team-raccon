<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Raccoon Team HQ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f4f0;color:#1a1a1a;min-height:100vh;}
#root{max-width:700px;margin:0 auto;padding:2rem 1rem;}
#app{padding:1rem 0;}
.tab-bar{display:flex;gap:8px;margin-bottom:1.5rem;}
.tab-btn{flex:1;padding:10px;border:1px solid #d0cfc8;border-radius:8px;background:#fff;color:#666;font-size:14px;cursor:pointer;font-family:inherit;transition:all 0.2s;}
.tab-btn:hover{background:#f0efe8;transform:translateY(-1px);}
.tab-btn.active{background:#E8F5E9;color:#2E7D32;border-color:#A5D6A7;font-weight:500;}
.section{display:none;}.section.active{display:block;}
.day-nav{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap;}
.day-pill{padding:6px 13px;border-radius:999px;border:1px solid #d0cfc8;background:#f0efe8;color:#666;font-size:13px;cursor:pointer;font-family:inherit;transition:all 0.18s;}
.day-pill:hover{transform:translateY(-2px);box-shadow:0 3px 8px rgba(0,0,0,0.1);}
.day-pill.active{background:#C8E6C9;color:#2E7D32;border-color:#A5D6A7;font-weight:500;transform:translateY(-2px);}
.fact-card{position:relative;overflow:hidden;border:1px solid #d0cfc8;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:1rem;transition:opacity 0.28s,transform 0.28s;background:#fff;}
.fact-card.fade-out{opacity:0;transform:translateY(6px);}
.scene-wrap{width:100%;position:relative;height:320px;cursor:crosshair;}
.scene-wrap svg{width:100%;height:100%;display:block;}
.hint-badge{position:absolute;bottom:10px;right:12px;background:rgba(0,0,0,0.35);color:white;font-size:11px;padding:4px 9px;border-radius:999px;pointer-events:none;letter-spacing:0.03em;opacity:0.85;z-index:2;}
.fact-bottom{padding:0 1.5rem 1.5rem;display:flex;flex-direction:column;align-items:center;gap:.75rem;width:100%;}
.fact-label{font-size:12px;color:#999;text-transform:uppercase;letter-spacing:.06em;}
.fact-raccoon-name{font-size:20px;font-weight:500;color:#2E7D32;}
.fact-text{font-size:15px;color:#1a1a1a;line-height:1.7;text-align:center;max-width:500px;}
.nav-btns{display:flex;gap:8px;margin-top:1rem;justify-content:center;}
.nav-btn{padding:9px 24px;border:1px solid #d0cfc8;border-radius:8px;background:#fff;color:#1a1a1a;font-size:14px;cursor:pointer;font-family:inherit;transition:all 0.18s;}
.nav-btn:hover:not(:disabled){background:#f0efe8;transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,0.08);}
.nav-btn:active:not(:disabled){transform:translateY(0);}
.nav-btn:disabled{opacity:0.3;cursor:default;}
.builder-card{background:#fff;border:1px solid #d0cfc8;border-radius:12px;padding:1.5rem;}
.builder-row{display:flex;gap:8px;margin-bottom:1rem;}
.builder-input{flex:1;padding:10px 14px;border:1px solid #d0cfc8;border-radius:8px;font-size:15px;font-family:inherit;background:#fff;color:#1a1a1a;transition:border-color 0.2s,box-shadow 0.2s;}
.builder-input:focus{outline:none;border-color:#A5D6A7;box-shadow:0 0 0 3px rgba(165,214,167,0.3);}
.builder-btn{padding:10px 22px;border:1px solid #A5D6A7;border-radius:8px;background:#E8F5E9;color:#2E7D32;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:all 0.18s;}
.builder-btn:hover{background:#C8E6C9;transform:translateY(-2px);box-shadow:0 4px 10px rgba(46,125,50,0.15);}
.builder-btn:active{transform:translateY(0);}
.result-area{display:none;flex-direction:column;align-items:center;gap:1rem;text-align:center;padding-top:1rem;border-top:1px solid #e8e7e0;margin-top:1rem;opacity:0;transform:translateY(12px);transition:opacity 0.4s,transform 0.4s;}
.result-area.show{display:flex;}.result-area.animate{opacity:1;transform:translateY(0);}
.raccoon-result-name{font-size:22px;font-weight:500;color:#2E7D32;}
.raccoon-result-title{font-size:14px;color:#666;}
.result-scene{width:100%;max-width:400px;height:240px;cursor:crosshair;position:relative;}
.result-scene svg{width:100%;height:100%;display:block;}
.raccoon-fun-fact{font-size:14px;color:#666;max-width:420px;line-height:1.6;background:#f0efe8;border-radius:8px;padding:.75rem 1rem;}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes tailWag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
@keyframes blink{0%,85%,100%{transform:scaleY(1)}91%{transform:scaleY(0.05)}}
@keyframes legL{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(8deg)}}
@keyframes legR{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-10deg)}}
@keyframes armL{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-22deg)}}
@keyframes armR{0%,100%{transform:rotate(0deg)}50%{transform:rotate(22deg)}}
@keyframes cloud{0%{transform:translateX(0)}100%{transform:translateX(40px)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes earTwitch{0%,80%,100%{transform:rotate(0deg)}88%{transform:rotate(-12deg)}}
@keyframes sparkle{0%{opacity:1;transform:scale(1) translate(0,0)}100%{opacity:0;transform:scale(0) translate(var(--sx),var(--sy))}}
@keyframes ripple{0%{r:4;opacity:0.8}100%{r:28;opacity:0}}
@keyframes sniffSniff{0%,100%{transform:translateY(0)}40%,60%{transform:translateY(2px)}}
</style>
</head>
<body>
<div id="root">
<div id="app">
  <h2 style="font-size:22px;font-weight:500;color:#1a1a1a;margin-bottom:.25rem;">🦝 Raccoon Team HQ</h2>
  <p style="font-size:14px;color:#666;margin-bottom:1.25rem;">7 trash panda facts + your personal raccoon identity</p>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('facts')">Daily Raccoon Facts</button>
    <button class="tab-btn" onclick="switchTab('builder')">Raccoon Name Builder</button>
  </div>
  <div id="facts" class="section active">
    <div class="day-nav" id="dayNav"></div>
    <div class="fact-card" id="factCard">
      <div class="scene-wrap" id="sceneWrap">
        <span class="hint-badge">Click anywhere to levitate! 🦝</span>
      </div>
      <div class="fact-bottom">
        <div class="fact-label" id="factDate"></div>
        <div class="fact-raccoon-name" id="factRaccoonName"></div>
        <div class="fact-text" id="factText"></div>
      </div>
    </div>
    <div class="nav-btns">
      <button class="nav-btn" id="prevBtn" onclick="changeDay(-1)">← Previous</button>
      <button class="nav-btn" id="nextBtn" onclick="changeDay(1)">Next →</button>
    </div>
  </div>
  <div id="builder" class="section">
    <div class="builder-card">
      <p style="font-size:15px;color:#1a1a1a;margin-bottom:1rem;line-height:1.6;">Enter your name to discover your raccoon alter ego!</p>
      <div class="builder-row">
        <input class="builder-input" id="nameInput" placeholder="Your name..." maxlength="30" onkeydown="if(event.key==='Enter')buildRaccoon()"/>
        <button class="builder-btn" onclick="buildRaccoon()">Generate 🦝</button>
      </div>
      <div class="result-area" id="resultArea">
        <div class="raccoon-result-name" id="resultName"></div>
        <div class="raccoon-result-title" id="resultTitle"></div>
        <div class="result-scene" id="resultScene"></div>
        <div class="raccoon-fun-fact" id="resultFact"></div>
      </div>
    </div>
  </div>
</div>
</div>

<script>
/* ── PHYSICS ── */
const physics={};
function initPhysics(id){physics[id]={x:300,y:160,vx:0,vy:0,tx:300,ty:160,floating:false,bobT:0,bobOffset:0,shadowScale:1};}
function getPhysics(id){if(!physics[id])initPhysics(id);return physics[id];}
const rafLoops={};
function startLoop(id,svgEl){
  if(rafLoops[id])cancelAnimationFrame(rafLoops[id]);
  function tick(){
    const p=getPhysics(id);
    if(p.floating){
      const dx=p.tx-p.x,dy=p.ty-p.y;
      p.vx=(p.vx+dx*0.07)*0.78; p.vy=(p.vy+dy*0.07)*0.78;
      p.x+=p.vx; p.y+=p.vy;
      p.bobT+=0.04; p.bobOffset=Math.sin(p.bobT)*7;
      const lift=Math.max(0,160-p.y);
      p.shadowScale=Math.max(0.2,1-lift/180);
      if(Math.abs(dx)<0.3&&Math.abs(dy)<0.3&&Math.abs(p.vx)<0.1&&Math.abs(p.vy)<0.1)p.floating=false;
    } else {p.bobOffset=0;p.shadowScale=1;}
    applyTransform(id,svgEl,p);
    rafLoops[id]=requestAnimationFrame(tick);
  }
  tick();
}
function applyTransform(id,svgEl,p){
  const g=svgEl.querySelector('.raccoon-root');
  const sh=svgEl.querySelector('.raccoon-shadow');
  if(!g)return;
  if(p.floating){
    g.style.animation='none';
    g.style.transform=`translate(${p.x-300}px,${p.y-160+p.bobOffset}px)`;
    g.style.transformOrigin='300px 160px';
    if(sh){sh.style.transform=`scaleX(${p.shadowScale})`;sh.style.transformOrigin='300px 220px';sh.style.opacity=p.shadowScale*0.13;}
  } else {
    g.style.animation=''; g.style.transform='';
    if(sh){sh.style.transform='';sh.style.opacity='';}
  }
}
function handleClick(e,id,svgEl){
  const r=svgEl.getBoundingClientRect();
  const cx=(e.clientX-r.left)*(600/r.width), cy=(e.clientY-r.top)*(320/r.height);
  const p=getPhysics(id);
  p.floating=true; p.tx=cx; p.ty=cy;
  spawnSparkles(svgEl,cx,cy); spawnRipple(svgEl,cx,cy);
}
function spawnSparkles(svgEl,cx,cy){
  const ns='http://www.w3.org/2000/svg';
  const cols=['#FFD700','#FF9800','#9C27B0','#4CAF50','#F48FB1','#80DEEA','#FF5722'];
  for(let i=0;i<10;i++){
    const a=(Math.PI*2*i/10)+Math.random()*0.5, d=30+Math.random()*50;
    const sx=Math.cos(a)*d, sy=Math.sin(a)*d;
    const s=document.createElementNS(ns,'polygon');
    const r=4+Math.random()*5;
    const pts=Array.from({length:5},(_,k)=>{const ang=(k*4*Math.PI/5)-Math.PI/2;const ri=k%2===0?r:r*0.45;return`${cx+Math.cos(ang)*ri},${cy+Math.sin(ang)*ri}`;}).join(' ');
    s.setAttribute('points',pts); s.setAttribute('fill',cols[i%cols.length]);
    s.style.cssText=`--sx:${sx}px;--sy:${sy}px;animation:sparkle 0.6s ease-out forwards;transform-origin:${cx}px ${cy}px;`;
    svgEl.appendChild(s); setTimeout(()=>s.remove(),700);
  }
}
function spawnRipple(svgEl,cx,cy){
  const ns='http://www.w3.org/2000/svg';
  const c=document.createElementNS(ns,'circle');
  c.setAttribute('cx',cx);c.setAttribute('cy',cy);c.setAttribute('r','4');
  c.setAttribute('fill','none');c.setAttribute('stroke','rgba(255,255,255,0.8)');c.setAttribute('stroke-width','2.5');
  c.style.cssText='animation:ripple 0.5s ease-out forwards;';
  svgEl.appendChild(c); setTimeout(()=>c.remove(),600);
}
function attachPhysics(wrapEl,id){
  initPhysics(id);
  wrapEl.addEventListener('click',e=>{
    const svgEl=wrapEl.querySelector('svg'); if(!svgEl)return;
    handleClick(e,id,svgEl); startLoop(id,svgEl);
  });
}

/* ── SCENE BUILDER ── */
function scene(skyTop,skyBot,groundCol,raccoonSVG,sceneId){

  <!-- sky -->
  <rect width="600" height="230" fill="${skyTop}"/>
  <rect y="200" width="600" height="120" fill="${groundCol}"/>
  <rect y="192" width="600" height="22" fill="${skyBot}" opacity="0.35"/>
  <!-- moon/sun -->
  <circle cx="520" cy="62" r="36" fill="${skyBot}" opacity="0.9"/>
  <!-- stars (night scenes) -->
  <circle cx="80" cy="40" r="2" fill="white" opacity="0.6"/>
  <circle cx="140" cy="22" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="220" cy="50" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="360" cy="30" r="2" fill="white" opacity="0.5"/>
  <circle cx="450" cy="55" r="1.5" fill="white" opacity="0.4"/>
  <!-- clouds -->
  <g style="animation:cloud 12s ease-in-out infinite alternate">
    <rect x="50" y="50" width="88" height="26" rx="13" fill="white" opacity="0.18"/>
    <rect x="80" y="40" width="58" height="24" rx="12" fill="white" opacity="0.14"/>
  </g>
  <g style="animation:cloud 16s ease-in-out infinite alternate-reverse">
    <rect x="280" y="68" width="100" height="24" rx="12" fill="white" opacity="0.13"/>
    <rect x="320" y="58" width="64" height="22" rx="11" fill="white" opacity="0.10"/>
  </g>
  <!-- trash cans background -->
  <g opacity="0.35">
    <rect x="48" y="178" width="28" height="36" rx="4" fill="#888"/>
    <rect x="44" y="174" width="36" height="8" rx="3" fill="#aaa"/>
    <rect x="58" y="162" width="8" height="14" rx="2" fill="#aaa"/>
  </g>
  <g opacity="0.25">
    <rect x="520" y="182" width="24" height="30" rx="3" fill="#888"/>
    <rect x="517" y="178" width="30" height="7" rx="3" fill="#aaa"/>
  </g>
  <!-- fence -->
  <rect x="0" y="204" width="600" height="6" fill="#8B6914" opacity="0.4"/>
  <rect x="80" y="185" width="6" height="26" rx="2" fill="#8B6914" opacity="0.35"/>
  <rect x="180" y="185" width="6" height="26" rx="2" fill="#8B6914" opacity="0.35"/>
  <rect x="280" y="185" width="6" height="26" rx="2" fill="#8B6914" opacity="0.35"/>
  <rect x="380" y="185" width="6" height="26" rx="2" fill="#8B6914" opacity="0.35"/>
  <rect x="480" y="185" width="6" height="26" rx="2" fill="#8B6914" opacity="0.35"/>
  <!-- bushes -->
  <g style="animation:sway 4s ease-in-out infinite;transform-origin:150px 210px">
    <ellipse cx="150" cy="206" rx="28" ry="18" fill="#2d5a1b" opacity="0.5"/>
    <ellipse cx="136" cy="210" rx="18" ry="14" fill="#3a7a22" opacity="0.5"/>
    <ellipse cx="164" cy="210" rx="18" ry="14" fill="#3a7a22" opacity="0.5"/>
  </g>
  <g style="animation:sway 3.5s ease-in-out infinite reverse;transform-origin:450px 210px">
    <ellipse cx="450" cy="206" rx="26" ry="16" fill="#2d5a1b" opacity="0.45"/>
    <ellipse cx="438" cy="210" rx="16" ry="12" fill="#3a7a22" opacity="0.45"/>
    <ellipse cx="462" cy="210" rx="16" ry="12" fill="#3a7a22" opacity="0.45"/>
  </g>
  <!-- ground -->
  <ellipse cx="160" cy="222" rx="26" ry="9" fill="#000" opacity="0.07"/>
  <ellipse cx="440" cy="224" rx="20" ry="7" fill="#000" opacity="0.06"/>
  <!-- raccoon -->
  ${raccoonSVG}
  </svg>`;
}

/* ── RACCOON CHARACTERS ── */
/* All raccoons share: grey body, black mask, striped tail, white face accents */

/* 1. STANDING RACCOON — upright, holding something */
function raccoonStanding(bc,ac,mask,tail1,tail2){
  return`<g class="raccoon-root" style="animation:bob 2s ease-in-out infinite;transform-origin:300px 175px">
  <ellipse class="raccoon-shadow" cx="300" cy="222" rx="44" ry="8" fill="#000" opacity="0.13"/>
  <!-- tail -->
  <g style="animation:tailWag 1.8s ease-in-out infinite;transform-origin:266px 198px">
    <path d="M266 198 Q240 210 220 222 Q210 230 215 236 Q222 236 236 228 Q256 216 268 202Z" fill="${tail1}" stroke="#111" stroke-width="2"/>
    <path d="M266 198 Q242 208 224 218 Q216 224 219 230" stroke="${tail2}" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M264 200 Q244 212 228 224" stroke="${tail2}" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>
  <!-- body -->
  <ellipse cx="300" cy="188" rx="48" ry="50" fill="${bc}" stroke="#111" stroke-width="2.5"/>
  <!-- belly -->
  <ellipse cx="300" cy="196" rx="28" ry="34" fill="#e8e0d4" stroke="none"/>
  <!-- left arm holding trash lid -->
  <g style="animation:armL 2s ease-in-out infinite;transform-origin:264px 172px">
    <path d="M264 168 L242 160 L234 152" stroke="#111" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M234 152 L228 146 M234 152 L228 154 M234 152 L230 158" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
    <!-- trash lid -->
    <ellipse cx="224" cy="144" rx="16" ry="6" fill="#bbb" stroke="#111" stroke-width="2"/>
    <rect x="220" y="136" width="8" height="9" rx="3" fill="#999" stroke="#111" stroke-width="1.5"/>
  </g>
  <!-- right arm -->
  <g style="animation:armR 2s ease-in-out infinite;transform-origin:336px 172px">
    <path d="M336 168 L354 162 L362 156" stroke="#111" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M362 156 L368 150 M362 156 L369 158 M362 156 L365 163" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- legs -->
  <g style="animation:legL 1.8s ease-in-out infinite;transform-origin:278px 224px">
    <path d="M270 222 Q266 234 264 248 L278 248 Q280 234 284 222Z" fill="${bc}" stroke="#111" stroke-width="2.5"/>
    <path d="M264 248 L256 254 M264 248 L272 254 M264 248 L278 248" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g style="animation:legR 1.8s ease-in-out infinite;transform-origin:322px 224px">
    <path d="M316 222 Q320 234 322 248 L336 248 Q334 234 330 222Z" fill="${bc}" stroke="#111" stroke-width="2.5"/>
    <path d="M322 248 L314 254 M322 248 L328 254 M322 248 L336 248" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- HEAD -->
  <g style="animation:bob 2.6s ease-in-out infinite reverse;transform-origin:300px 122px">
    <!-- neck -->
    <path d="M280 152 Q284 136 300 132 Q316 132 320 148Z" fill="${bc}" stroke="#111" stroke-width="2"/>
    <!-- head round -->
    <circle cx="300" cy="118" r="36" fill="${bc}" stroke="#111" stroke-width="2.5"/>
    <!-- white face -->
    <ellipse cx="300" cy="122" rx="24" ry="20" fill="#f0ebe0" stroke="none"/>
    <!-- BLACK MASK across eyes -->
    <path d="M268 108 Q278 102 290 106 Q300 110 310 106 Q322 102 332 108 Q328 118 318 118 Q310 120 300 118 Q290 120 282 118 Q272 118 268 108Z" fill="${mask}" stroke="#111" stroke-width="1.5"/>
    <!-- eyes white -->
    <circle cx="288" cy="112" r="7" fill="white" stroke="#111" stroke-width="1.5"/>
    <circle cx="312" cy="112" r="7" fill="white" stroke="#111" stroke-width="1.5"/>
    <!-- pupils -->
    <circle cx="289" cy="112" r="3.5" fill="#111" style="animation:blink 3.5s ease-in-out infinite;transform-origin:289px 112px"/>
    <circle cx="313" cy="112" r="3.5" fill="#111" style="animation:blink 3.5s ease-in-out infinite;transform-origin:313px 112px"/>
    <!-- eye glints -->
    <circle cx="290" cy="110" r="1.2" fill="white"/>
    <circle cx="314" cy="110" r="1.2" fill="white"/>
    <!-- nose -->
    <ellipse cx="300" cy="124" rx="5" ry="3.5" fill="#222" style="animation:sniffSniff 2s ease-in-out infinite"/>
    <!-- mouth -->
    <path d="M294 130 Q300 135 306 130" stroke="#111" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- ears -->
    <g style="animation:earTwitch 4s ease-in-out infinite;transform-origin:278px 88px">
      <path d="M270 96 Q268 78 280 72 Q290 68 292 84Z" fill="${bc}" stroke="#111" stroke-width="2"/>
      <path d="M273 94 Q272 80 281 76 Q288 74 289 86Z" fill="#e8b4b0" stroke="none"/>
    </g>
    <g style="animation:earTwitch 4.4s ease-in-out infinite reverse;transform-origin:322px 88px">
      <path d="M330 96 Q332 78 320 72 Q310 68 308 84Z" fill="${bc}" stroke="#111" stroke-width="2"/>
      <path d="M327 94 Q328 80 319 76 Q312 74 311 86Z" fill="#e8b4b0" stroke="none"/>
    </g>
    <!-- cheek fluff -->
    <ellipse cx="276" cy="126" rx="9" ry="6" fill="#ddd5c8" opacity="0.6"/>
    <ellipse cx="324" cy="126" rx="9" ry="6" fill="#ddd5c8" opacity="0.6"/>
  </g>
</g>`;
}

/* 2. SNEAKY RACCOON — crouched, low to ground */
function raccoonSneaky(bc,ac,mask,tail1,tail2){
  return`<g class="raccoon-root" style="animation:bob 1.6s ease-in-out infinite;transform-origin:300px 190px">
  <ellipse class="raccoon-shadow" cx="300" cy="224" rx="52" ry="8" fill="#000" opacity="0.13"/>
  <!-- tail up -->
  <g style="animation:tailWag 1.5s ease-in-out infinite;transform-origin:340px 192px">
    <path d="M340 192 Q365 175 380 158 Q390 145 385 135 Q378 128 370 138 Q360 152 344 170 Q342 180 340 195Z" fill="${tail1}" stroke="#111" stroke-width="2"/>
    <path d="M341 190 Q364 172 378 156 Q386 144 381 136" stroke="${tail2}" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M342 186 Q362 170 374 156" stroke="${tail2}" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>
  <!-- crouched body -->
  <ellipse cx="300" cy="200" rx="60" ry="36" fill="${bc}" stroke="#111" stroke-width="2.5" transform="rotate(-8,300,200)"/>
  <ellipse cx="298" cy="204" rx="38" ry="22" fill="#e8e0d4" stroke="none" transform="rotate(-8,298,204)"/>
  <!-- paws forward -->
  <g style="animation:armL 1.6s ease-in-out infinite;transform-origin:252px 208px">
    <path d="M252 204 L228 212 L216 218" stroke="#111" stroke-width="3.5" stroke-linecap="round" fill="none"/>

/* ── DATA ── */
const RACCOON_FNS = [
  raccoonStanding, raccoonSneaky, raccoonSitting,
  raccoonRunning, raccoonClimbing, raccoonFood, raccoonSleeping
];

/* body color, accent, mask, tail stripe1, tail stripe2 */
const RACCOON_STYLES = [
  {bc:'#9E9E9E',ac:'#616161',mask:'#212121',tail1:'#9E9E9E',tail2:'#212121'}, // classic grey
  {bc:'#8D6E63',ac:'#5D4037',mask:'#1a1a1a',tail1:'#8D6E63',tail2:'#2d2d2d'}, // brown
  {bc:'#78909C',ac:'#455A64',mask:'#1a1a1a',tail1:'#78909C',tail2:'#1a1a1a'}, // blue-grey
  {bc:'#A5D6A7',ac:'#388E3C',mask:'#1B5E20',tail1:'#A5D6A7',tail2:'#1B5E20'}, // green
  {bc:'#CE93D8',ac:'#7B1FA2',mask:'#4A148C',tail1:'#CE93D8',tail2:'#4A148C'}, // purple
  {bc:'#FFCC80',ac:'#E65100',mask:'#3E2723',tail1:'#FFCC80',tail2:'#3E2723'}, // orange
  {bc:'#F48FB1',ac:'#C2185B',mask:'#880E4F',tail1:'#F48FB1',tail2:'#880E4F'}, // pink
  {bc:'#80DEEA',ac:'#0097A7',mask:'#006064',tail1:'#80DEEA',tail2:'#006064'}, // teal
  {bc:'#EF9A9A',ac:'#C62828',mask:'#4a1a1a',tail1:'#EF9A9A',tail2:'#4a1a1a'}, // red
];

const DAYS_DATA = [
  {label:'Sun 4',  date:'Sunday, May 4',    name:'The Dumpster Diver',    sky:['#1a1a2e','#16213e'], ground:'#2d4a1e', styleIdx:0, fnIdx:0},
  {label:'Mon 5',  date:'Monday, May 5',   name:'The Midnight Bandit',   sky:['#0d1b2a','#1b263b'], ground:'#1a3a0a', styleIdx:2, fnIdx:1},
  {label:'Tue 6',  date:'Tuesday, May 6',  name:'The Wash Station Chef', sky:['#2c1654','#3d1a6e'], ground:'#1a2a0a', styleIdx:4, fnIdx:2},
  {label:'Wed 7',  date:'Wednesday, May 7',name:'The Urban Sprinter',    sky:['#1a0a00','#2d1200'], ground:'#2a1a00', styleIdx:5, fnIdx:3},
  {label:'Thu 8',  date:'Thursday, May 8', name:'The Roof Climber',      sky:['#0a1628','#152238'], ground:'#0a2a1a', styleIdx:1, fnIdx:4},
  {label:'Fri 9',  date:'Friday, May 9',   name:'The Pizza Thief',       sky:['#1a0a2a','#2d1245'], ground:'#1a2a0a', styleIdx:6, fnIdx:5},
  {label:'Sat 10', date:'Saturday, May 10',name:'The Trash Napper',      sky:['#0d0d1a','#1a1a2e'], ground:'#0a1a00', styleIdx:7, fnIdx:6},
];

const FACTS = [
  'Raccoons can unlock complex locks, latches, and even jar lids — their nimble front paws have the dexterity of a 5-year-old human child. No trash can is truly safe.',
  'Raccoons don\'t actually "wash" their food. They wet their paws to enhance the sensitivity of touch receptors — they\'re basically doing a sensory investigation of every meal.',
  'A group of raccoons is called a "nursery" or a "gaze." They have no fixed home and may sleep in a different spot every night — true urban nomads.',
  'Raccoons can run up to 15 mph and are excellent swimmers. They can also open doors, unscrew lids, and remember solutions to puzzles for up to 3 years.',
  'Raccoons are one of the few mammals that regularly live in cities. Urban raccoons have been shown to be significantly smarter than their rural cousins — city life sharpens the mind.',
  'Raccoons will eat almost anything: insects, fruit, eggs, small animals, and yes — your pizza. They consume up to 35% of their body weight in autumn to prepare for winter.',
  'Raccoons sleep up to 16 hours a day in winter but don\'t truly hibernate. They wake up on warm nights to raid kitchens, birdfeeders, and unattended snacks without remorse.',
];

const SUFFIXES = ['coon','bandit','paws','mask','trash','washer','sneak','napper','scavenger','rascal'];
const PREFIXES = ['Sneaky','Masked','Midnight','Urban','Crafty','Trash','Shadow','Nimble','Fuzzy','Dumpster'];
const TRAITS   = ['master of the recycling bin','feared by all trash cans','apex snack liberator','lock-pick extraordinaire','pizza slice hunter','midnight kitchen raider','champion dumpster diver','legendary lid unscrew-er'];

let currentDay = 0;

function buildDayNav(){
  const nav=document.getElementById('dayNav'); nav.innerHTML='';
  DAYS_DATA.forEach((d,i)=>{
    const btn=document.createElement('button');
    btn.className='day-pill'+(i===currentDay?' active':'');
    btn.textContent=d.label;
    btn.onclick=()=>{currentDay=i;animateFact();};
    nav.appendChild(btn);
  });
}

function renderFact(){
  const d=DAYS_DATA[currentDay];
  const st=RACCOON_STYLES[d.styleIdx];
  const fn=RACCOON_FNS[d.fnIdx];
  document.getElementById('factDate').textContent=d.date;
  document.getElementById('factRaccoonName').textContent=d.name;
  document.getElementById('factText').textContent=FACTS[currentDay];
  const wrap=document.getElementById('sceneWrap');
  wrap.innerHTML=`<span class="hint-badge">Click anywhere to levitate! 🦝</span>`;
  wrap.insertAdjacentHTML('afterbegin',scene(d.sky[0],d.sky[1],d.ground,fn(st.bc,st.ac,st.mask,st.tail1,st.tail2),'main'));
  document.getElementById('prevBtn').disabled=currentDay===0;
  document.getElementById('nextBtn').disabled=currentDay===DAYS_DATA.length-1;
  buildDayNav();
  initPhysics('main');
  const svgEl=wrap.querySelector('svg');
  if(svgEl)startLoop('main',svgEl);
  attachPhysics(wrap,'main');
}

function animateFact(){
  const card=document.getElementById('factCard');
  card.classList.add('fade-out');
  if(rafLoops['main'])cancelAnimationFrame(rafLoops['main']);
  setTimeout(()=>{renderFact();card.classList.remove('fade-out');},260);
}

function changeDay(dir){currentDay=Math.max(0,Math.min(DAYS_DATA.length-1,currentDay+dir));animateFact();}

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',['facts','builder'][i]===tab));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
}

function hashName(n){let h=0;for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))&0xffffffff;return Math.abs(h);}

function buildRaccoon(){
  const raw=document.getElementById('nameInput').value.trim(); if(!raw)return;
  const h=hashName(raw.toLowerCase());
  const d=DAYS_DATA[h%DAYS_DATA.length];
  const st=RACCOON_STYLES[(h>>6)%RACCOON_STYLES.length];
  const fn=RACCOON_FNS[(h>>3)%RACCOON_FNS.length];
  const suffix=SUFFIXES[h%SUFFIXES.length];
  const prefix=PREFIXES[(h>>4)%PREFIXES.length];
  const base=raw.charAt(0).toUpperCase()+raw.slice(1).toLowerCase();
  const fullTitle=prefix+' '+base+' the '+suffix.charAt(0).toUpperCase()+suffix.slice(1);
  const trait=TRAITS[(h>>8)%TRAITS.length];
  document.getElementById('resultName').textContent=fullTitle;
  document.getElementById('resultTitle').textContent=raw+' — '+trait;
  const wrap=document.getElementById('resultScene');
  const sid='builder-'+raw;
  wrap.innerHTML=scene(d.sky[0],d.sky[1],d.ground,fn(st.bc,st.ac,st.mask,st.tail1,st.tail2),sid);
  document.getElementById('resultFact').textContent=`${fullTitle} prowls the urban jungle as a ${trait}. Their distinctive markings have made them the most recognizable bandit on the block.`;
  const ra=document.getElementById('resultArea');
  ra.classList.add('show');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    ra.classList.add('animate');
    initPhysics(sid);
    const svgEl=wrap.querySelector('svg');
    if(svgEl)startLoop(sid,svgEl);
    attachPhysics(wrap,sid);
  }));
}

renderFact();
</script>
